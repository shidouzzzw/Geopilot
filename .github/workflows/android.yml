name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Lint, birim testleri ve debug APK
        run: gradle lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: geopilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
